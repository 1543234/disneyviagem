<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#050719">
<title>Roteiro Orlando 2026</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Roteiro interativo da viagem a Orlando, de 04 a 16 de dezembro de 2026.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Martian+Mono:wght@400;600&family=Onest:wght@400;500;600;700&family=Unbounded:wght@500;700&display=swap">
<style>
/* Layout: carteira de passes holográficos. Barra fixa com faixa de datas; visão geral = contagem + pendências + carteira; dia = passe com canhoto de endereços + programação + dicas. */
:root{
  /* Paleta da vinheta Disney: azul pérsico → majorelle → lavanda → heliotrópio, com brilho diamante e dourado de fogos */
  --persian:#1738B7; --majorelle:#504DF4; --lav:#A76BFE; --helio:#DE5BF8; --diamond:#BFF5FD; --gold:#F6C76B;
  --bg:#050719; --bg-2:#0C1236; --bar:rgba(5,7,25,.80);
  --ink:#EEF0FF; --ink-2:#B0B7E4; --ink-3:#767EB2;
  --line:rgba(170,180,255,.16); --glass:rgba(16,22,62,.62); --glass-2:rgba(26,34,92,.72); --glass-hi:rgba(255,255,255,.05);
  --accent:#A3A0FF; --accent-ink:#0B1033; --warn:#FFB547; --warn-bg:rgba(255,181,71,.11); --ok:#5BE3B0;
  --shadow:0 24px 60px -22px rgba(1,3,20,.85);
  --aur-1:rgba(80,77,244,.30); --aur-2:rgba(222,91,248,.17); --aur-3:rgba(23,56,183,.34);
  --f-display:"Unbounded","Arial Black",system-ui,sans-serif;
  --f-body:"Onest",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"Martian Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
  --r-lg:26px; --r-md:18px; --r-sm:12px;
  color-scheme:dark;
}

/* ---------- base ---------- */
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%;scroll-padding-top:170px}
body{
  margin:0;min-height:100vh;background-color:var(--bg);color:var(--ink);
  font:400 16px/1.55 var(--f-body);-webkit-font-smoothing:antialiased;overflow-x:hidden;
  background-image:
    radial-gradient(60% 42% at 12% -4%,var(--aur-1),transparent 70%),
    radial-gradient(48% 36% at 92% 6%,var(--aur-2),transparent 70%),
    radial-gradient(70% 50% at 50% 104%,var(--aur-3),transparent 70%);
  background-attachment:fixed;
}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--bg)}
button{font:inherit;color:inherit;cursor:pointer}
a{color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:10px}
svg.i{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
svg.i.fill{fill:currentColor;stroke:none}
#sky{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
.app{position:relative;z-index:1}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.mono{font-family:var(--f-mono)}
.eyebrow{font:600 11px/1.2 var(--f-mono);letter-spacing:.16em;text-transform:uppercase;color:var(--accent)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- barra superior ---------- */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:var(--bar);
  -webkit-backdrop-filter:blur(18px) saturate(1.4);backdrop-filter:blur(18px) saturate(1.4);border-bottom:1px solid var(--line)}
.top-row{display:flex;align-items:center;gap:12px;padding-block:10px 6px}
.brand{display:flex;align-items:center;gap:10px;background:none;border:0;padding:4px 6px 4px 0;text-align:left}
.mark{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;color:#fff;
  background:conic-gradient(from 200deg,var(--persian),var(--majorelle),var(--helio),var(--lav),var(--persian));
  box-shadow:0 6px 20px -6px var(--majorelle)}
.mark svg{width:18px;height:18px}
.brand-t{display:flex;flex-direction:column;line-height:1.1}
.brand-t b{font:700 15px/1.1 var(--f-display);letter-spacing:.01em}
.brand-t span{font:400 10px/1.4 var(--f-mono);letter-spacing:.14em;color:var(--ink-3);text-transform:uppercase}
.top-act{margin-left:auto;display:flex;gap:8px}
.icon-btn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--line);background:var(--glass);color:var(--ink)}
.icon-btn:hover{background:var(--glass-2)}

.strip{display:flex;gap:8px;overflow-x:auto;padding-block:4px 12px;scroll-snap-type:x proximity;scrollbar-width:none;
  -webkit-mask-image:linear-gradient(90deg,transparent 0,#000 14px,#000 calc(100% - 22px),transparent);
          mask-image:linear-gradient(90deg,transparent 0,#000 14px,#000 calc(100% - 22px),transparent)}
.strip::-webkit-scrollbar{display:none}
.chip{flex:none;scroll-snap-align:center;display:flex;flex-direction:column;align-items:center;gap:3px;min-width:58px;
  padding:8px 10px 9px;border-radius:16px;border:1px solid var(--line);background:var(--glass);color:var(--ink-2);position:relative;
  transition:transform .2s ease,background .2s ease}
.chip:hover{transform:translateY(-1px)}
.chip .wd{font:600 9.5px/1 var(--f-mono);letter-spacing:.14em;text-transform:uppercase}
.chip .dn{font:700 18px/1 var(--f-display);color:var(--ink);font-variant-numeric:tabular-nums}
.chip .dot{width:18px;height:4px;border-radius:4px;background:linear-gradient(90deg,var(--a1),var(--a2))}
.chip svg.i{width:18px;height:18px;color:var(--ink)}
.chip[aria-current="page"]{background:linear-gradient(160deg,var(--a1),var(--a2));border-color:transparent;color:rgba(255,255,255,.9);
  box-shadow:0 10px 24px -10px var(--a1)}
.chip[aria-current="page"] .dn,.chip[aria-current="page"] svg.i{color:#fff}
.chip[aria-current="page"] .dot{background:rgba(255,255,255,.85)}
.chip.is-today::after{content:"hoje";position:absolute;top:-7px;right:-4px;font:600 8.5px/1 var(--f-mono);letter-spacing:.08em;
  padding:3px 5px;border-radius:6px;background:var(--ok);color:#04131a}

.live{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px;padding:8px 12px;border-radius:14px;
  background:var(--glass-2);border:1px solid var(--line);font-size:13.5px;line-height:1.35}
.live-dot{width:9px;height:9px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 0 var(--ok);animation:ping 1.8s infinite}
.live b{font-weight:600}
.live .tag{font:600 9.5px/1 var(--f-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--ok)}
.live button{margin-left:auto;border:1px solid var(--line);background:var(--glass-hi);border-radius:999px;padding:5px 11px;font-size:12.5px}
.live a{font-weight:600;text-decoration:none;color:var(--accent)}
@keyframes ping{0%{box-shadow:0 0 0 0 rgba(91,227,176,.6)}70%{box-shadow:0 0 0 9px rgba(91,227,176,0)}100%{box-shadow:0 0 0 0 rgba(91,227,176,0)}}

/* ---------- visão geral ---------- */
.ov{padding-block:26px 48px;display:flex;flex-direction:column;gap:28px}
.ov-head{display:grid;gap:22px;align-items:end}
.hero h1{margin:10px 0 0;font:700 clamp(44px,12vw,92px)/.92 var(--f-display);letter-spacing:-.025em}
.hero h1 span{display:block;width:fit-content;font-size:.42em;letter-spacing:-.01em;margin-top:.35em;
  background:linear-gradient(90deg,var(--persian),var(--majorelle) 35%,var(--lav) 65%,var(--helio));
  -webkit-background-clip:text;background-clip:text;color:transparent}
.lede{margin:16px 0 0;max-width:52ch;color:var(--ink-2);font-size:16.5px}
.count{border-radius:var(--r-lg);padding:20px 20px 18px;background:var(--glass);border:1px solid var(--line);box-shadow:var(--shadow);
  -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.count-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:12px}
.cu{display:flex;flex-direction:column;gap:4px;padding:12px 6px 10px;border-radius:14px;background:var(--glass-hi);border:1px solid var(--line);text-align:center}
.cu b{font:700 clamp(24px,7.4vw,40px)/1 var(--f-display);font-variant-numeric:tabular-nums}
.cu span{font:600 9.5px/1 var(--f-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3)}
.count-foot{margin:12px 0 0;font-size:13.5px;color:var(--ink-2)}
.count-big{margin:10px 0 0;font:700 clamp(22px,6vw,30px)/1.15 var(--f-display)}

.stats{display:flex;flex-wrap:wrap;gap:8px}
.stat{display:inline-flex;align-items:center;gap:8px;padding:8px 13px;border-radius:999px;background:var(--glass);border:1px solid var(--line);font-size:14px}
.stat i{width:10px;height:10px;border-radius:50%;background:linear-gradient(135deg,var(--a1),var(--a2))}
.stat b{font-weight:700;font-variant-numeric:tabular-nums}

.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:0 0 14px}
.sec-h h2{margin:0;font:700 17px/1.2 var(--f-display);letter-spacing:.005em}
.sec-h small{font:400 11px/1.3 var(--f-mono);color:var(--ink-3);letter-spacing:.06em}

.pend{border-radius:var(--r-lg);padding:20px;background:var(--glass);border:1px solid var(--line)}
.pend ul{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.pend-row{width:100%;display:grid;grid-template-columns:4px 54px minmax(0,1fr) 20px;align-items:center;gap:12px;text-align:left;
  padding:11px 12px 11px 0;border-radius:14px;border:1px solid var(--line);background:var(--glass-hi);overflow:hidden}
.pend-row:hover{background:var(--glass-2)}
.pend-row .sv{align-self:stretch;background:var(--ink-3);border-radius:0 4px 4px 0}
.pend-row[data-sev="warn"] .sv{background:var(--warn)}
.pend-row .dt{font:600 12px/1.2 var(--f-mono);color:var(--ink-2);text-align:center}
.pend-row .tx{font-size:14.5px;line-height:1.4}
.pend-row svg.i{color:var(--ink-3);width:18px;height:18px}

.wallet{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
.wallet > .mp:last-child{grid-column:span 2}
.mp{--notch:9px;position:relative;isolation:isolate;overflow:hidden;display:flex;flex-direction:column;justify-content:space-between;gap:14px;
  min-height:162px;padding:14px 14px 15px;border-radius:20px;border:1px solid rgba(255,255,255,.2);text-align:left;color:#fff;
  background:linear-gradient(150deg,var(--a1),var(--a2));box-shadow:0 18px 40px -22px var(--a1);
  -webkit-mask:radial-gradient(circle var(--notch) at left 42%,#0000 97%,#000) left/51% 100% no-repeat,radial-gradient(circle var(--notch) at right 42%,#0000 97%,#000) right/51% 100% no-repeat;
          mask:radial-gradient(circle var(--notch) at left 42%,#0000 97%,#000) left/51% 100% no-repeat,radial-gradient(circle var(--notch) at right 42%,#0000 97%,#000) right/51% 100% no-repeat;
  transition:transform .25s cubic-bezier(.2,.8,.2,1),filter .25s ease;animation:rise .5s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i,0)*35ms)}
.mp::before{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(105deg,transparent 30%,rgba(255,255,255,.32) 48%,transparent 64%) 160% 0/250% 100% no-repeat;transition:background-position .7s ease}
.mp:hover{transform:translateY(-4px)}
.mp:hover::before{background-position:-60% 0}
.mp .gl{position:absolute;right:-14px;top:-12px;width:96px;height:96px;opacity:.22;z-index:-1}
.mp .gl svg{width:100%;height:100%}
.mp-d{display:flex;align-items:baseline;gap:8px}
.mp-d b{font:700 30px/1 var(--f-display);font-variant-numeric:tabular-nums}
.mp-d span{font:600 10px/1 var(--f-mono);letter-spacing:.14em;text-transform:uppercase;opacity:.85}
.mp-perf{position:absolute;left:16px;right:16px;top:42%;border-top:2px dashed rgba(255,255,255,.42)}
.mp-t{display:block;font:600 15.5px/1.25 var(--f-body);text-wrap:balance}
.mp-c{display:block;font:600 9.5px/1.3 var(--f-mono);letter-spacing:.12em;text-transform:uppercase;opacity:.82;margin-top:5px}
.mp.is-past{filter:saturate(.35) brightness(.9)}
.mp.is-today{outline:2px solid var(--ok);outline-offset:3px}
.mp .flag{align-self:center;opacity:1;font:600 9px/1 var(--f-mono);letter-spacing:.1em;text-transform:uppercase;padding:4px 6px;border-radius:6px;background:rgba(0,0,0,.28)}

@keyframes rise{from{opacity:.35;transform:translateY(10px)}to{opacity:1;transform:none}}
</style>
<style>
/* ---------- dia ---------- */
.day{padding-block:18px 48px}
.day-grid{display:grid;grid-template-columns:minmax(0,1fr);gap:18px}
.col{display:contents}
.b-opts{order:1}.b-pass{order:2}.b-alert{order:3}.b-tl{order:4}.b-ideas{order:5}.b-tips{order:6}.b-nav{order:7}
.card{border-radius:var(--r-lg);padding:20px;background:var(--glass);border:1px solid var(--line);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}

/* passe holográfico */
.pass{position:relative;isolation:isolate;overflow:hidden;border-radius:var(--r-lg);color:#fff;
  background:linear-gradient(150deg,var(--a1),var(--a2));box-shadow:var(--shadow),0 30px 70px -42px var(--a1);
  border:1px solid rgba(255,255,255,.22);animation:rise .5s cubic-bezier(.2,.8,.2,1) both}
.pass::before{content:"";position:absolute;inset:0;z-index:-1;pointer-events:none;
  background:radial-gradient(90% 70% at var(--mx,25%) var(--my,0%),rgba(255,255,255,.34),transparent 60%),
             repeating-linear-gradient(118deg,rgba(255,255,255,0) 0 13px,rgba(255,255,255,.055) 13px 14px)}
.pass::after{content:"";position:absolute;inset:0;z-index:-1;pointer-events:none;
  background:linear-gradient(105deg,transparent 38%,rgba(255,255,255,.26) 50%,transparent 62%) 0 0/260% 100% no-repeat;animation:sweep 7.5s ease-in-out infinite}
@keyframes sweep{0%,18%{background-position:130% 0}60%,100%{background-position:-30% 0}}
.pass-main{padding:20px 20px 18px;display:flex;flex-direction:column;gap:14px;position:relative}
.pass-top{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.ptag{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:999px;background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.28);
  font:600 10px/1 var(--f-mono);letter-spacing:.12em;text-transform:uppercase}
.ptag.warn{background:rgba(20,8,0,.32);border-color:rgba(255,200,120,.55);color:#FFE2B0}
.pwhen{font:600 11px/1 var(--f-mono);letter-spacing:.14em;text-transform:uppercase;opacity:.92}
.pass-title{margin:0;font:700 clamp(27px,7.6vw,42px)/1.04 var(--f-display);letter-spacing:-.015em;text-wrap:balance;text-shadow:0 2px 18px rgba(0,0,0,.18)}
.pass-sub{margin:-6px 0 0;font-size:15px;opacity:.92}
.pass-gl{position:absolute;right:-18px;top:-16px;width:150px;height:150px;opacity:.2;pointer-events:none}
.pass-gl svg{width:100%;height:100%}
.pstats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.pstat{padding:10px 10px 9px;border-radius:14px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.22)}
.pstat span{display:block;font:600 9.5px/1 var(--f-mono);letter-spacing:.12em;text-transform:uppercase;opacity:.85}
.pstat b{display:block;margin-top:6px;font:700 19px/1 var(--f-display);font-variant-numeric:tabular-nums}
.pstat b.sm{font:600 13px/1.2 var(--f-body)}
.swap-row{display:grid;gap:8px}
.swap{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:12px;width:100%;text-align:left;padding:10px 14px;border-radius:16px;border:1px solid rgba(255,255,255,.4);background:rgba(255,255,255,.14);color:#fff}
.swap small{display:block;font:600 9.5px/1.2 var(--f-mono);letter-spacing:.12em;text-transform:uppercase;opacity:.85}
.swap b{display:block;font-size:15px;font-weight:700;margin-top:2px}
.swap:hover{background:rgba(255,255,255,.26)}
.swap svg.i{width:17px;height:17px}
.swap em{font-style:normal;font-size:13px;font-weight:600;padding:6px 10px;border-radius:999px;background:rgba(255,255,255,.2)}
.perf{position:relative;height:20px}
.perf::before{content:"";position:absolute;left:18px;right:18px;top:50%;border-top:2px dashed rgba(255,255,255,.5)}
.perf i{position:absolute;top:50%;width:22px;height:22px;margin-top:-11px;border-radius:50%;background:var(--bg)}
.perf i:first-child{left:-11px}.perf i:last-child{right:-11px}
.stub{padding:6px 20px 20px;display:grid;gap:14px;background:linear-gradient(180deg,rgba(6,8,34,.06),rgba(6,8,34,.22))}
.stub-h{font:600 10px/1 var(--f-mono);letter-spacing:.16em;text-transform:uppercase;opacity:.85}
.place{display:grid;gap:6px;padding:14px;border-radius:16px;background:rgba(8,10,40,.2);border:1px solid rgba(255,255,255,.2)}
.place-n{font-weight:700;font-size:16px;line-height:1.3}
.addr{font:400 12.5px/1.55 var(--f-mono);opacity:.95;-webkit-user-select:text;user-select:text;overflow-wrap:anywhere}
.place-note{display:flex;gap:8px;align-items:flex-start;font-size:13px;line-height:1.4;opacity:.9}
.place-note svg.i{width:16px;height:16px;margin-top:1px}
.acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:4px}
.act{display:inline-flex;align-items:center;gap:7px;padding:9px 13px;border-radius:12px;font-size:13.5px;font-weight:600;text-decoration:none;
  border:1px solid rgba(255,255,255,.34);background:rgba(255,255,255,.14);color:#fff}
.act:hover{background:rgba(255,255,255,.26)}
.act.pri{background:#fff;color:#0B1140;border-color:#fff}
.act.pri:hover{background:#EEF0FF}
.act svg.i{width:16px;height:16px}
.place.tbd{border-style:dashed;background:rgba(8,10,40,.12)}
.place.tbd .addr{opacity:.85;font-style:italic}

/* opções do dia 07 */
.seg{position:relative;display:grid;grid-template-columns:1fr 1fr;padding:5px;border-radius:20px;background:var(--glass);border:1px solid var(--line)}
.seg-ind{position:absolute;top:5px;bottom:5px;left:5px;width:calc(50% - 5px);border-radius:15px;background:linear-gradient(150deg,var(--a1),var(--a2));
  box-shadow:0 10px 26px -12px var(--a1);transition:transform .35s cubic-bezier(.2,.8,.2,1)}
.seg[data-opt="o2"] .seg-ind{transform:translateX(100%)}
.seg button{position:relative;z-index:1;border:0;background:none;padding:11px 8px;border-radius:15px;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--ink-2)}
.seg button b{font:700 14px/1.2 var(--f-display);color:var(--ink)}
.seg button span{font-size:12.5px}
.seg button[aria-pressed="true"],.seg button[aria-pressed="true"] b{color:#fff}
.seg-note{margin:12px 2px 0;font-size:14px;color:var(--ink-2);line-height:1.5}
.seg-note b{color:var(--ink);font-weight:600}

/* alerta */
.alert{display:grid;grid-template-columns:24px minmax(0,1fr);gap:12px;border-radius:var(--r-lg);padding:18px;border:1px solid var(--warn);background:var(--warn-bg)}
.alert svg.i{color:var(--warn);width:22px;height:22px;margin-top:2px}
.alert h3{margin:0;font:700 15px/1.3 var(--f-display)}
.alert p{margin:6px 0 0;font-size:14.5px;color:var(--ink-2)}
.alert ul{margin:8px 0 0;padding-left:18px;font-size:14.5px;color:var(--ink-2);display:grid;gap:4px}

/* programação */
.tl{list-style:none;margin:0;padding:0}
.tl-item{position:relative;display:grid;grid-template-columns:58px 40px minmax(0,1fr);gap:0 12px;padding-bottom:20px;animation:rise .45s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i,0)*45ms)}
.tl-item:last-child{padding-bottom:0}
.tl-item::before{content:"";position:absolute;left:calc(58px + 12px + 19px);top:42px;bottom:2px;width:2px;border-radius:2px;background:linear-gradient(var(--a1),var(--a2));opacity:.55}
.tl-item:last-child::before{display:none}
.tl-time{padding-top:10px;text-align:right;font:600 14px/1.2 var(--f-mono);font-variant-numeric:tabular-nums}
.tl-time small{display:block;margin-top:4px;font:400 9px/1.2 var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}

.tl-body{padding-top:7px;min-width:0}
.tl-title{display:flex;align-items:center;flex-wrap:wrap;gap:8px;font-weight:600;font-size:16px;line-height:1.35}
.tl-desc{margin:3px 0 0;font-size:14.5px;color:var(--ink-2);line-height:1.5}
.tl-warn{display:inline-flex;gap:8px;align-items:flex-start;margin-top:8px;padding:7px 10px;border-radius:10px;background:var(--warn-bg);color:var(--warn);font-size:13.5px;font-weight:500;line-height:1.4}
.tl-warn svg.i{width:16px;height:16px;margin-top:1px}
.badge{font:600 9px/1 var(--f-mono);letter-spacing:.12em;text-transform:uppercase;padding:4px 7px;border-radius:6px;background:var(--glass-2);border:1px solid var(--line);color:var(--ink-2)}
.badge.now{background:var(--ok);border-color:transparent;color:#04131a}
.badge.next{color:var(--accent);border-color:var(--accent)}
.badge.tbd{border-style:dashed}
.tl-item[data-state="past"]{opacity:.48}
.tl-item[data-state="now"] .tl-node{background:linear-gradient(150deg,var(--a1),var(--a2));border-color:transparent;color:#fff;animation:glow 2.4s ease-in-out infinite}

.tl-empty{margin:0;color:var(--ink-2);font-size:15px}
.ico-land{transform:rotate(135deg)}
.ico-up{transform:rotate(45deg)}

/* dicas */
.tips ul{list-style:none;margin:0;padding:0;display:grid;gap:12px}
.tips li{display:grid;grid-template-columns:18px minmax(0,1fr);gap:10px;font-size:15px;line-height:1.5}
.tips li svg.i{width:16px;height:16px;margin-top:3px;color:var(--accent)}

/* ideias do dia livre */
.ideas-g{display:grid;grid-template-columns:minmax(0,1fr);gap:12px}
.idea{display:grid;gap:6px;padding:16px;border-radius:var(--r-md);background:var(--glass-hi);border:1px solid var(--line)}
.idea h3{margin:0;font-size:16px;line-height:1.3}
.idea p{margin:0;font-size:14px;color:var(--ink-2)}
.idea .addr{color:var(--ink-2)}
.act-g{display:inline-flex;align-items:center;gap:7px;padding:8px 12px;border-radius:12px;font-size:13.5px;font-weight:600;text-decoration:none;border:1px solid var(--line);background:var(--glass);color:var(--ink)}
.act-g:hover{background:var(--glass-2)}
.act-g.pri{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.act-g svg.i{width:16px;height:16px}

/* navegação entre dias */
.daynav{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.dn-btn{display:flex;align-items:center;gap:10px;padding:14px;border-radius:var(--r-md);border:1px solid var(--line);background:var(--glass);text-align:left;min-width:0}
.dn-btn:hover{background:var(--glass-2)}
.dn-btn.next{justify-content:flex-end;text-align:right}
.dn-btn span{display:block;font:600 10px/1.2 var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3)}
.dn-btn b{display:block;font-size:14.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dn-btn > div{min-width:0}

/* encerramento */
.fim{text-align:left}
.fim p{margin:0 0 12px;color:var(--ink-2)}

/* folha de escolha */
.sheet-wrap{position:fixed;inset:0;z-index:80;display:grid;align-items:end}
.sheet-bd{position:absolute;inset:0;background:rgba(3,5,22,.55);-webkit-backdrop-filter:blur(5px);backdrop-filter:blur(5px)}
.sheet{position:relative;max-height:86vh;overflow:auto;background:var(--bg-2);border:1px solid var(--line);border-radius:26px 26px 0 0;
  padding:10px max(18px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));

.grab{width:44px;height:5px;border-radius:5px;background:var(--line);margin:4px auto 14px}
.sheet h3{margin:0;font:700 18px/1.25 var(--f-display)}
.sheet-sub{margin:6px 0 16px;color:var(--ink-2);font-size:14px}
.opt-list{display:grid;gap:10px}
.opt{display:grid;grid-template-columns:46px minmax(0,1fr) 22px;gap:12px;align-items:center;width:100%;text-align:left;padding:12px;border-radius:16px;border:1px solid var(--line);background:var(--glass-hi)}
.opt:hover{background:var(--glass)}
.opt[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.opt-sw{width:46px;height:46px;border-radius:13px;background:linear-gradient(150deg,var(--a1),var(--a2));display:grid;place-items:center;color:#fff}
.opt-sw svg.i{width:22px;height:22px}
.opt b{display:block;font-size:15.5px}
.opt span{display:block;font-size:13.5px;color:var(--ink-2);margin-top:2px}
.opt .w{color:var(--warn);font-weight:500}
.opt .ck{color:var(--accent);opacity:0}
.opt[aria-pressed="true"] .ck{opacity:1}
.sheet-close{margin-top:14px;width:100%;padding:13px;border-radius:14px;border:1px solid var(--line);background:var(--glass);font-weight:600}

.toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:90;
  padding:11px 18px;border-radius:999px;background:var(--ink);color:var(--bg);font-weight:600;font-size:14px;box-shadow:var(--shadow);max-width:calc(100vw - 32px)}

.foot{padding-block:8px 36px;border-top:1px solid var(--line);color:var(--ink-3);font-size:13px;display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center}
.foot p{margin:14px 0 0;flex:1 1 280px}
.foot button{margin-top:14px;border:1px solid var(--line);background:var(--glass);border-radius:999px;padding:8px 14px;font-size:13px;color:var(--ink)}

.home-btn{margin-left:auto;display:inline-flex;align-items:center;gap:8px;height:40px;padding:0 15px 0 12px;border-radius:999px;

.route-note{margin:2px 0 0;font-size:12.5px;line-height:1.45;opacity:.85}
.tl-time small + small{margin-top:2px}
.ov-two{display:grid;gap:18px}
.tix-row{width:100%;display:grid;grid-template-columns:4px minmax(0,1fr) auto;align-items:center;gap:12px;text-align:left;
  padding:11px 12px 11px 0;border-radius:14px;border:1px solid var(--line);background:var(--glass-hi);overflow:hidden}
.tix-row:hover{background:var(--glass-2)}
.tix-row .sv{align-self:stretch;border-radius:0 4px 4px 0;background:var(--ok)}
.tix-row[data-st="buy"] .sv{background:var(--warn)}
.tix-row .tx{font-size:14.5px;line-height:1.4;min-width:0}
.tix-row .tx b{font-weight:600}
.tix-row .tx small{display:block;margin-top:2px;font-size:13px;color:var(--ink-2)}
.tix-row .st{font:600 9.5px/1 var(--f-mono);letter-spacing:.1em;text-transform:uppercase;padding:5px 8px;border-radius:7px;white-space:nowrap;
  color:var(--ok);background:rgba(91,227,176,.12);border:1px solid rgba(91,227,176,.35)}
.tix-row[data-st="buy"] .st{color:var(--warn);background:var(--warn-bg);border-color:rgba(255,181,71,.4)}
@media (min-width:980px){ .ov-two{grid-template-columns:minmax(0,1fr) minmax(0,1fr);align-items:start} }

/* ---------- telas maiores ---------- */
@media (min-width:640px){ .ideas-g{grid-template-columns:repeat(2,minmax(0,1fr))} }
@media (min-width:980px){
  .ov-head{grid-template-columns:minmax(0,1.15fr) minmax(0,.85fr)}
  .day{padding-block:26px 56px}
  .day-grid{grid-template-columns:minmax(0,440px) minmax(0,1fr);gap:24px;align-items:start}
  .col{display:flex;flex-direction:column;gap:20px;min-width:0}
  .b-nav{grid-column:1 / -1}
  .tl-item{grid-template-columns:64px 42px minmax(0,1fr)}
  .tl-item::before{left:calc(64px + 12px + 20px)}
  .tl-node{width:42px;height:42px}
}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}
</style>

/* ===== Aplicação ===== */
const $ = (s, r = document) => r.querySelector(s);
const KEY = 'roteiro-orlando-2026';
const ORL = '-05:00', BRT = '-03:00';
const MESES = ['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];

const store = {
  get(){ try { return JSON.parse(localStorage.getItem(KEY)) || {}; } catch(e){ return {}; } },
  set(v){ try { localStorage.setItem(KEY, JSON.stringify(v)); } catch(e){} }
};
const saved = store.get();
const S = { opt: saved.opt === 'o2' ? 'o2' : 'o1', choices: saved.choices || {}, theme: saved.theme || null };
function save(){ store.set({ opt:S.opt, choices:S.choices, theme:S.theme }); }

let sim = null; // prévia do modo ao vivo
const now = () => sim ? new Date(sim.start + (Date.now() - sim.setAt)) : new Date();

function ico(name, extra = ''){
  const body = ICONS[name] || '';
  const fill = body.includes('class="f"');
  return `<svg class="i${fill ? ' fill' : ''}${extra ? ' ' + extra : ''}" viewBox="0 0 24 24" aria-hidden="true">${body}</svg>`;
}
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const choice = slot => (slot.list.includes(S.choices[slot.key]) ? S.choices[slot.key] : slot.def);
const fill = (str, map) => String(str ?? '').replace(/\{(\w+)\}/g, (m, k) => map[k] ?? m);
const dayById = id => DAYS.find(d => d.id === id);
const idx = id => DAYS.findIndex(d => d.id === id);
const absTime = (date, t, tz) => new Date(`${date}T${t}:00${tz === 'BRT' ? BRT : ORL}`);
const orlDate = d => d.toLocaleDateString('en-CA', { timeZone:'America/New_York' });
const tripState = () => { const n = now(); return n < new Date(TRIP.start) ? 'before' : (n > new Date(TRIP.end) ? 'after' : 'during'); };
const todayId = () => {
  if (tripState() !== 'during') return null;
  const t = orlDate(now());
  const d = DAYS.find(x => x.date === t);
  if (d) return d.id;
  return t < DAYS[0].date ? DAYS[0].id : DAYS[DAYS.length - 1].id;
};
const ticketFor = id => TICKETS.find(t => t.days.includes(id));

/* Transforma o dia (com escolhas e opção do dia 07) no que será mostrado */
function resolve(day){
  const v = { id:day.id, date:day.date, wd:day.wd, sub:day.sub, tips:day.tips || [], alert:day.alert, flag:day.flag, flagShort:day.flagShort,
    ideas:day.ideas, end:day.end, empty:day.empty, stats:day.stats, slots:[], title:day.title, cat:day.cat, places:day.places || [], items:day.items || [] };
  const notes = DATE_NOTES[day.date] || {};
  if (day.slot){
    const c = choice(day.slot);
    const P = PLACES[c];
    v.slots = [{ ...day.slot, val:c }];
    v.cat = c; v.title = P.short; v.places = [c];
    v.items = day.items.map(it => ({ ...it, title:fill(it.title, {u:P.short}), desc:fill(it.desc, {u:P.short, gps:P.gps}) }));
  }
  if (day.options){
    const o = day.options[S.opt];
    const map = {}, picked = {};
    const eve = {};
    v.slots = o.slots.map(s => { const c = choice(s); const k = s.key.endsWith('p1') ? 'p1' : s.key.endsWith('p2') ? 'p2' : 'p'; map[k] = PLACES[c].short; picked[k] = c; eve[k] = !!s.evening; return { ...s, val:c }; });
    v.items = o.items.map(it => ({ ...it, title:fill(it.title, map), desc:fill(it.desc, map), warn: it.noteFor ? (eve[it.noteFor] ? notes[picked[it.noteFor]] : undefined) : it.warn }));
    v.places = S.opt === 'o1' ? [picked.p] : [picked.p1, { key:picked.p2, from:picked.p1 }];
    v.stats = o.stats;
    if (S.opt === 'o1'){ v.title = map.p; v.cat = picked.p; }
    else { v.title = `${map.p1} + ${map.p2}`; v.cat = picked.p1; v.cat2 = picked.p2; }
    v.sub = o.hint;
    v.optNote = o.note;
    v.warnFlag = v.slots.some(s => s.evening && notes[s.val]) ? 'Atenção ao horário' : null;
  }
  const C = CATS[v.cat];
  v.a1 = C.a1; v.a2 = v.cat2 ? CATS[v.cat2].a2 : C.a2; v.label = C.label; v.glyph = C.glyph;
  return v;
}

/* Estado de cada item da programação no modo ao vivo */
function itemStates(v){
  const n = now();
  const times = v.items.map(it => /^\d\d:\d\d$/.test(it.t) ? absTime(it.date || v.date, it.t, it.tz) : null);
  const valid = times.map((t, i) => t ? i : -1).filter(i => i >= 0);
  if (!valid.length) return v.items.map(() => '');
  const first = times[valid[0]], last = times[valid[valid.length - 1]];
  if (n < first - 12 * 3600e3) return v.items.map(() => '');
  if (n > +last + 3 * 3600e3) return v.items.map(t => 'past');
  let cur = -1; valid.forEach(i => { if (times[i] <= n) cur = i; });
  const nxt = valid.find(i => times[i] > n);
  return v.items.map((_, i) => !times[i] ? '' : (i < cur ? 'past' : i === cur ? 'now' : i === nxt ? 'next' : ''));
}
function inLabel(ms){
  const m = Math.max(0, Math.round(ms / 60000)); const h = Math.floor(m / 60), r = m % 60;
  return h ? `${h}h${r ? ' ' + String(r).padStart(2,'0') + 'min' : ''}` : `${r} min`;
}

/* Links de rota */
function mapsUrl(q, o){ return `https://www.google.com/maps/dir/?api=1${o ? '&origin=' + encodeURIComponent(o) : ''}&destination=${encodeURIComponent(q)}&travelmode=driving`; }
function wazeUrl(q){ return `https://waze.com/ul?q=${encodeURIComponent(q)}&navigate=yes`; }
/* Ponto de partida da rota no Google Maps: a casa, salvo indicação. O Waze sempre usa a localização atual. */
function routeFrom(P, from){
  if (P.here) return null;
  const O = PLACES[from || 'casa'];
  return !O || O === P ? null : O;
}
function placeActions(P, cls, from, quiet){
  const q = P.nav || `${P.name}, ${P.addr}`;
  const O = routeFrom(P, from);
  const c = cls === 'g' ? 'act-g' : 'act';
  const note = O && !quiet ? `<p class="route-note">O Google Maps calcula a rota saindo ${esc(O.fromLabel || 'do ' + (O.short || O.name))}. O Waze usa a sua localização.</p>` : '';
  return `<div class="acts">
    <a class="${c} pri" href="${mapsUrl(q, O ? (O.nav || O.addr) : null)}" target="_blank" rel="noopener">${ico('nav')}Google Maps</a>
    <a class="${c}" href="${wazeUrl(q)}" target="_blank" rel="noopener">Waze</a>
    <button class="${c}" type="button" data-copy="${esc(P.addr)}">${ico('copy')}Copiar</button>
  </div>${note}`;
}

/* ---------- faixa de datas ---------- */
function renderStrip(view){
  const t = todayId();
  const chips = [`<button class="chip" type="button" data-go="visao-geral" style="--a1:#504DF4;--a2:#DE5BF8" ${view === 'visao-geral' ? 'aria-current="page"' : ''}>
      <span class="wd">Geral</span>${ico('grid')}<span class="dot"></span></button>`];
  DAYS.forEach(d => {
    const v = resolve(d);
    chips.push(`<button class="chip${t === d.id ? ' is-today' : ''}" type="button" data-go="dia-${d.id}" style="--a1:${v.a1};--a2:${v.a2}"
      ${view === 'dia-' + d.id ? 'aria-current="page"' : ''} aria-label="${d.wd} ${d.id} de dezembro: ${esc(v.title)}">
      <span class="wd">${d.wd}</span><span class="dn">${d.id}</span><span class="dot"></span></button>`);
  });
  const strip = $('#strip');
  strip.innerHTML = chips.join('');
  const act = strip.querySelector('[aria-current="page"]');
  if (act) act.scrollIntoView({ block:'nearest', inline:'center', behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth' });
}

    return `<div class="count" id="count"><span class="eyebrow">Contagem para o embarque</span>
      <div class="count-grid">

    if (e.touches.length !== 1 || e.target.closest('.seg,.acts,.swap-row')) { x0 = null; return; }
    x0 = e.touches[0].clientX; y0 = e.touches[0].clientY; t0 = Date.now();

/* ---------- céu com estrelas e fogos ---------- */
const Sky = (() => {
  const cv = $('#sky'), ctx = cv.getContext('2d');
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const COLORS = ['#DE5BF8','#A76BFE','#BFF5FD','#F6C76B','#504DF4'];
  let W = 0, H = 0, dpr = 1, stars = [], bursts = [], light = false, nextBurst = 0, raf = 0;
  function size(){
    dpr = Math.min(2, window.devicePixelRatio || 1);
    W = cv.clientWidth; H = cv.clientHeight;
    cv.width = W * dpr; cv.height = H * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    const n = Math.round(Math.min(130, W * H / 9000));
    stars = Array.from({ length:n }, () => ({ x:Math.random() * W, y:Math.random() * H * .9, r:Math.random() * 1.3 + .3, p:Math.random() * 6.28, s:.6 + Math.random() * 1.6 }));
  }
  function burst(){
    const x = W * (.15 + Math.random() * .7), y = H * (.08 + Math.random() * .3);
    const col = COLORS[Math.floor(Math.random() * COLORS.length)];
    const parts = Array.from({ length:42 }, (_, i) => { const a = i / 42 * 6.283, v = 1.1 + Math.random() * 1.4; return { x, y, vx:Math.cos(a) * v, vy:Math.sin(a) * v, life:1 }; });
    bursts.push({ col, parts });
  }
  function frame(t){
    ctx.clearRect(0, 0, W, H);
    const base = light ? '60,70,170' : '235,238,255';
    for (const s of stars){
      const a = (light ? .18 : .55) + Math.sin(t / 1000 * s.s + s.p) * (light ? .1 : .35);
      ctx.fillStyle = `rgba(${base},${Math.max(0, a)})`;
      ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, 6.283); ctx.fill();
    }
    if (!reduce){
      if (t > nextBurst){ burst(); nextBurst = t + 5200 + Math.random() * 4200; }
      for (const b of bursts){
        ctx.fillStyle = b.col;
        for (const p of b.parts){
          p.x += p.vx; p.y += p.vy; p.vy += .018; p.vx *= .985; p.vy *= .985; p.life -= .009;
          if (p.life <= 0) continue;
          ctx.globalAlpha = Math.max(0, p.life) * (light ? .45 : .85);
          ctx.beginPath(); ctx.arc(p.x, p.y, 1.6, 0, 6.283); ctx.fill();
        }
      }
      ctx.globalAlpha = 1;
      bursts = bursts.filter(b => b.parts.some(p => p.life > 0));
      raf = requestAnimationFrame(frame);
    }
  }
  function start(){ cancelAnimationFrame(raf); if (reduce) frame(0); else raf = requestAnimationFrame(frame); }
  function recolor(){ light = effectiveTheme() === 'light'; if (reduce) frame(0); }
  addEventListener('resize', () => { size(); if (reduce) frame(0); });
  document.addEventListener('visibilitychange', () => { if (document.hidden) cancelAnimationFrame(raf); else start(); });
  return { init(){ size(); recolor(); nextBurst = performance.now() + 1500; start(); }, recolor };
})();
